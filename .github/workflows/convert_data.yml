name: Convert Meteorologic Data to CSV and XLSX

on:
  workflow_dispatch:
  push:
    paths:
      - '*.txt'
  schedule:
    - cron: '10 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install pandas openpyxl

      - name: Ejecutar script de conversión
        run: python parse_data.py

      - name: Subir cambios formateados al repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto-conversión de datos meteorológicos a CSV y XLSX'
          file_pattern: '*.csv *.xlsx'
